[project]
name = "trend-insight-ai"
version = "0.1.0"
description = "多角的な視点から世の中の空気感を読み解くAIインサイト抽出ツール"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.20.0",
    "feedparser>=6.0.0",
    "wordcloud>=1.9.0",
    "janome>=0.5.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "atproto>=0.0.46",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "llama-cpp-python>=0.2.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
