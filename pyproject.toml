[project]
name = "trend-insight-ai"
version = "0.1.0"
description = "多角的な視点から世の中の空気感を読み解くAIインサイト抽出ツール"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.20.0",
    "feedparser>=6.0.0",
    "wordcloud>=1.9.0",
    "janome>=0.5.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "atproto>=0.0.46",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "urllib3>=2.7.0",
    "llama-cpp-python>=0.2.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that require ML model loading (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/ui/*",
    "src/orchestrator.py",
    "src/reporter.py",
    "src/adapters.py",
    "src/logging_config.py",
    "src/services/wordcloud_generator.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]
show_missing = true
fail_under = 65

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "B008",   # function call in default argument (Streamlit pattern)
    "SIM108", # ternary operator (readability preference)
    "RUF001", # ambiguous unicode in string (Japanese text is intentional)
    "RUF002", # ambiguous unicode in docstring (Japanese text is intentional)
    "RUF003", # ambiguous unicode in comment (Japanese text is intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "llama_cpp.*", "transformers.*", "torch.*", "feedparser.*", "wordcloud.*", "janome.*", "atproto.*", "huggingface_hub.*"]
ignore_missing_imports = true
